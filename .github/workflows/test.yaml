name: test

on: [push, pull_request]

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # macOS 14 runners were retired on 2026-11-02; macOS 15 is the
        # current arm64 image.
        os: [macos-15, ubuntu-24.04]

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: configure example
        run: cmake -S example -B example/build -DCMAKE_BUILD_TYPE=Release

      - name: build example
        run: cmake --build example/build --parallel 2

      - name: run example
        run: ./example/build/example example/config.yaml

      - name: configure tests
        run: cmake -S tests -B tests/build -DCMAKE_BUILD_TYPE=Release

      - name: build tests
        run: cmake --build tests/build --parallel 2

      - name: run tests
        run: ctest --test-dir tests/build --output-on-failure
